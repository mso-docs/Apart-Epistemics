# Extra secret rules for the Apart epistemics project, on top of gitleaks defaults.
# Used by scripts/prepublish_scan.sh. Do not put real tokens in this file.
title = "apart-epistemics prepublish rules"

[extend]
useDefault = true

[[rules]]
id = "apart-huggingface-token"
description = "Hugging Face token (hf_...)"
regex = '''hf_[A-Za-z0-9]{20,}'''
keywords = ["hf_"]

[[rules]]
id = "apart-openrouter-key"
description = "OpenRouter API key (sk-or-...)"
regex = '''sk-or-(?:v1-)?[A-Za-z0-9]{16,}'''
keywords = ["sk-or-"]

[[rules]]
id = "apart-generic-api-key"
description = "Generic API key or token assignment"
regex = '''(?i)\b(?:api[_-]?key|api[_-]?secret|access[_-]?token|auth[_-]?token|hf_token|openrouter_api_key)\s*[=:]\s*(?:'[^'\n]{16,}'|"[^"\n]{16,}"|[A-Za-z0-9\-./+]{20,})'''
keywords = ["api_key", "api-key", "apikey", "api_secret", "access_token", "auth_token", "hf_token", "openrouter_api_key"]

[[allowlists]]
description = "Documentation placeholders, not real credentials"
regexes = ['''YOUR_API_KEY''', '''your-api-key''', '''changeme''', '''<your-''', '''EXAMPLE_KEY''', '''PASTE_''']
paths = ['''\.env\.example$''', '''(^|/)tests/''']
